<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AG PICKS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#09070f;
  --panel:#151020;
  --purple:#9b5cff;
  --text:#f7f3ff;
  --muted:#b9adc9;
}
*{box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header {
  padding:20px;
  background:#100b19;
  border-bottom:1px solid #302342;
}
.logo {
  font-size:25px;
  font-weight:900;
}
.logo span{color:#c29aff}
.container {
  width:92%;
  max-width:1100px;
  margin:auto;
}
.hero {
  padding:45px 0;
}
.hero h1 {
  font-size:40px;
}
.hero span{color:#c29aff}
input,button {
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #49345f;
  background:var(--panel);
  color:white;
  font-size:15px;
}
button {
  background:var(--purple);
  border:0;
  font-weight:bold;
  cursor:pointer;
}
.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin:25px 0;
}
.card {
  background:var(--panel);
  border:1px solid #302342;
  border-radius:14px;
  overflow:hidden;
}
.card img {
  width:100%;
  height:190px;
  object-fit:contain;
  background:#21162e;
}
.card-content{padding:15px}
.old-price {
  color:#aaa;
  text-decoration:line-through;
}
.offer {
  color:#c29aff;
  font-size:20px;
  font-weight:bold;
}
.buy {
  display:block;
  text-align:center;
  background:#9b5cff;
  color:white;
  padding:12px;
  border-radius:8px;
  text-decoration:none;
  margin-top:12px;
}
#admin {
  background:#151020;
  padding:20px;
  border-radius:15px;
  margin:35px 0;
}
.hidden{display:none}
small{color:var(--muted)}
</style>
</head>

<body>

<header>
  <div class="container logo">
    AG <span>PICKS</span>
  </div>
</header>

<main class="container">

<section class="hero">
  <h1>Your picks.<br><span>Smarter buys.</span></h1>
  <p>Discover useful products and smart shopping deals.</p>
</section>

<h2>Featured Products</h2>
<div id="products" class="products">
  Loading products...
</div>

<section id="admin">

<h2>Admin Login</h2>

<div id="loginBox">
  <input id="email" type="email" placeholder="Admin email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="hidden">

  <h2>Add Product</h2>

  <input id="pname" placeholder="Product name">

  <input id="price" type="number" placeholder="Original price">

  <input id="offer" type="number" placeholder="Offer price">

  <input id="plink" type="url" placeholder="Flipkart affiliate link">

  <label>Product Image</label>
  <input id="photo" type="file" accept="image/*">

  <button onclick="addProduct()">Upload Product</button>

  <button onclick="logout()">Logout</button>

</div>

<p id="message"></p>

</section>

</main>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL =
"https://gpvwgaemgkglhcudifnk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_L0GPj1yImZurdT0Py4kKvg_xG5QT1Di";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// LOAD PRODUCTS

async function loadProducts(){

  const box = document.getElementById("products");

  const {data,error} = await db
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    box.innerHTML = "Products loading failed. Check Supabase permissions.";
    console.error(error);
    return;
  }

  box.innerHTML = "";

  if(!data || data.length === 0){
    box.innerHTML = "No products available yet.";
    return;
  }

  data.forEach(p => {

    const image = p.image_url || "";

    box.innerHTML += 
      <div class="card">

        ${image ? <img src="${escapeHTML(image)}" alt="">` : ""}

        <div class="card-content">

          <h3>${escapeHTML(p.name || "")}</h3>

          <p class="old-price">₹${Number(p.price || 0)}</p>

          <p class="offer">₹${Number(p.offer_price || 0)}</p>
[09-11-2026 02:03 PM] Athi 🫂💥: <a class="buy"
             href="${safeURL(p.link)}"
             target="_blank"
             rel="noopener noreferrer">
             Buy Now
          </a>

        </div>
      </div>
    `;

  });

}


// ADMIN LOGIN

async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const {error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  showAdmin();
}


// CHECK LOGIN

async function showAdmin(){

  const {data} = await db.auth.getSession();

  if(data.session){

    document.getElementById("loginBox").classList.add("hidden");

    document.getElementById("adminPanel").classList.remove("hidden");

  }

}


// LOGOUT

async function logout(){

  await db.auth.signOut();

  location.reload();

}


// ADD PRODUCT + IMAGE UPLOAD

async function addProduct(){

  const message = document.getElementById("message");

  const name = document.getElementById("pname").value.trim();
  const price = Number(document.getElementById("price").value);
  const offer = Number(document.getElementById("offer").value);
  const link = document.getElementById("plink").value.trim();
  const file = document.getElementById("photo").files[0];

  if(!name  !price  !offer  !link  !file){
    alert("Please fill all fields and select an image.");
    return;
  }

  if(!/^https?:\/\//i.test(link)){
    alert("Enter a valid product link.");
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Please select an image.");
    return;
  }

  message.textContent = "Uploading image...";

  const extension = file.name.split(".").pop();

  const fileName =
    Date.now() + "." + extension;

  const {error:uploadError} = await db.storage
    .from("product-images")
    .upload(fileName,file);

  if(uploadError){
    message.textContent = uploadError.message;
    return;
  }

  const {data:imageData} = db.storage
    .from("product-images")
    .getPublicUrl(fileName);

  const imageURL = imageData.publicUrl;

  message.textContent = "Saving product...";

  const {error} = await db
    .from("products")
    .insert([{
      name:name,
      price:price,
      offer_price:offer,
      image_url:imageURL,
      link:link
    }]);

  if(error){
    message.textContent = error.message;
    return;
  }

  message.textContent = "Product added successfully!";

  document.getElementById("pname").value = "";
  document.getElementById("price").value = "";
  document.getElementById("offer").value = "";
  document.getElementById("plink").value = "";
  document.getElementById("photo").value = "";

  loadProducts();

}


// BASIC OUTPUT SAFETY

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function safeURL(value){
  try{
    const u = new URL(value);
    return ["http:","https:"].includes(u.protocol) ? u.href : "#";
  }catch{
    return "#";
  }
}


// START

loadProducts();
showAdmin();

</script>

</body>
</html>
